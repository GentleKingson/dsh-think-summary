name: regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dsh: ['0.2.2-rc.5']
        include:
          - os: ubuntu-latest
            dsh: '0.2.2-rc.3'
          - os: ubuntu-latest
            dsh: '0.2.2-rc.4'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - if: matrix.dsh == '0.2.2-rc.5'
        run: npm ci --ignore-scripts
      - name: Select DSH test dependencies
        if: matrix.dsh != '0.2.2-rc.5'
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            "@deepseek-ai/dsh-home-paths@$DSH_VERSION" \
            "@deepseek-ai/dsh-client-connection@$DSH_VERSION" \
            "@deepseek-ai/dsh-host-webserver@$DSH_VERSION" \
            "@deepseek-ai/dsh-llm@$DSH_VERSION" \
            "@deepseek-ai/dsh-llm-deepseek@$DSH_VERSION" \
            "@deepseek-ai/dsh-settings@$DSH_VERSION"
      - run: npm run build
      - run: npm run test:unit
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:browser
      - if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: refs/tags/dsh-v${{ matrix.dsh }}
          path: .test-host-source
      - if: runner.os == 'Linux'
        run: npm run test:desktop
        env:
          DSH_OFFICIAL_SOURCE: ${{ github.workspace }}/.test-host-source
      - run: npm pack --dry-run --ignore-scripts
