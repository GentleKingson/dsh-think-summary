name: regression
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 38a6a5c965aa99ab525161efb7cc5cf1fe62fced
          path: .test-host-source
      - run: npm run test:desktop
        env:
          DSH_OFFICIAL_SOURCE: ${{ github.workspace }}/.test-host-source
      - run: npm pack --dry-run
